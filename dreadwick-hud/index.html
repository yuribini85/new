<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dreadwick HUD</title>
<style>
html,body{margin:0;height:100%;background:#0b0f10;overflow:hidden;font-family:Georgia,serif;color:#e7dcc6}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 45%,#2d4148 0,#172328 42%,#0a0f11 76%)}
#hud{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);width:min(1100px,145vw);height:auto;filter:drop-shadow(0 -12px 28px rgba(0,0,0,.55))}
#info{position:absolute;top:18px;right:18px;font:11px Arial,sans-serif;line-height:1.5;color:#cfc6b4;background:rgba(10,12,12,.55);border:1px solid rgba(230,220,200,.15);padding:10px 12px;backdrop-filter:blur(3px)}
#info b{color:#f2e8d6}.top{position:absolute;left:18px;top:18px;font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#bcb4a7}
.taskText{font-size:18px;fill:#f0e7d6;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.taskSub{font-size:10px;fill:#d0c4ae;text-anchor:middle;pointer-events:none}.dialText{fill:#272823;text-anchor:middle}.small{font-size:13px;letter-spacing:4px}.visitor{font-size:38px;font-weight:bold}.hour{font-size:31px;font-weight:bold}.time{font-size:20px;fill:#e7dcc6;text-anchor:middle;font-family:Arial,sans-serif}.tick{stroke:#373a33;stroke-width:1}.tick.major{stroke-width:2}.taskSeg{stroke:#1b1d1a;stroke-width:2}.taskSeg.active{stroke:#f3e6c9;stroke-width:5;filter:url(#glow)}.taskSeg.done{opacity:.22}.progressBase{fill:none;stroke:#5c584d;stroke-width:8}.progressFill{fill:none;stroke:#a88e59;stroke-width:8;stroke-linecap:round}.needle{stroke:#20231f;stroke-width:5;stroke-linecap:round}.needleAccent{stroke:#9b7f4e;stroke-width:2}.hubOuter{fill:#222521;stroke:#a38758;stroke-width:5}.hubInner{fill:#b3955c}.night{fill:#2a3030}.day{fill:#d4c8b1}.core{fill:#cfc2aa;stroke:#555247;stroke-width:2}
@media(max-width:700px){#info{font-size:9px;top:44px;right:10px}.top{font-size:8px;left:10px}.taskText{font-size:13px}.taskSub{font-size:8px}.visitor{font-size:30px}.hour{font-size:26px}.time{font-size:16px}}
</style>
</head>
<body>
<div id="wrap">
  <div class="top">Dreadwick Light Station · HUD de Rotina</div>
  <div id="info">
    <div><b>Visitante:</b> <span id="iVisitor"></span></div>
    <div><b>Em execução:</b> <span id="iTask"></span></div>
    <div><b>Próxima:</b> <span id="iNext"></span></div>
    <div><b>Concluídas:</b> <span id="iDone"></span></div>
  </div>

  <svg id="hud" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#918773"/><stop offset=".08" stop-color="#3a3d38"/><stop offset=".13" stop-color="#b7aa91"/><stop offset=".18" stop-color="#30332e"/><stop offset="1" stop-color="#1d211e"/></linearGradient>
    </defs>

    <path d="M40 540 A460 460 0 0 1 960 540 L900 540 A400 400 0 0 0 100 540 Z" fill="url(#metal)" stroke="#161815" stroke-width="3"/>
    <path d="M95 540 A405 405 0 0 1 905 540 L835 540 A335 335 0 0 0 165 540 Z" fill="#d2c5ad" stroke="#23251f" stroke-width="2"/>
    <path d="M165 540 A335 335 0 0 1 835 540 L790 540 A290 290 0 0 0 210 540 Z" fill="#252925" stroke="#171916" stroke-width="2"/>

    <path class="night" d="M210 540 A290 290 0 0 1 500 250 L500 540 Z" opacity=".52"/>
    <path class="day" d="M500 250 A290 290 0 0 1 790 540 L500 540 Z" opacity=".92"/>

    <g id="ticks"></g>
    <g id="tasks"></g>

    <path class="progressBase" d="M245 540 A255 255 0 0 1 755 540"/>
    <path id="progress" class="progressFill" d="M245 540 A255 255 0 0 1 755 540" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>

    <text x="245" y="493" class="dialText hour">6</text>
    <text x="245" y="454" class="dialText" style="font-size:30px">☾</text>
    <text x="755" y="493" class="dialText hour">12</text>
    <text x="755" y="454" class="dialText" style="font-size:30px">☼</text>

    <g id="needle" transform="rotate(-72 500 540)">
      <line x1="500" y1="540" x2="500" y2="285" class="needle"/>
      <line x1="500" y1="540" x2="500" y2="315" class="needleAccent"/>
      <polygon points="500,270 490,292 510,292" fill="#20231f"/>
    </g>

    <path d="M330 540 A170 170 0 0 1 670 540 L650 540 A150 150 0 0 0 350 540 Z" class="core"/>
    <text x="500" y="420" class="dialText small">VISITANTE</text>
    <text id="visitor" x="500" y="462" class="dialText visitor">THOMAS</text>
    <text id="dayLabel" x="500" y="491" class="dialText" style="font-size:13px;font-family:Arial,sans-serif;letter-spacing:2px">DIA 1</text>
    <text id="time" x="500" y="520" class="time">06:00</text>

    <circle cx="500" cy="540" r="35" class="hubOuter"/>
    <circle cx="500" cy="540" r="11" class="hubInner"/>
  </svg>
</div>
<script>
const DAY_MS=60000;
const visitors=['THOMAS','BETSY','STEWART','MARGARET','DOUGLAS','EILEEN','ANGUS','MAIRI'];
const tasks=[
 ['Limpar lente','player'],['Inspecionar gerador','auto'],['Reabastecer','player'],['Checar cais','auto'],['Patrulhar costa','player'],['Regular mecanismo','auto'],['Limpar vidros','player'],['Registrar clima','auto'],['Verificar rádio','player'],['Recolher suprimentos','auto']
];
const colors={player:'#214a64',auto:'#7d342a'};
const svgNS='http://www.w3.org/2000/svg';
const ticks=document.getElementById('ticks');
const taskG=document.getElementById('tasks');
const needle=document.getElementById('needle');
const progress=document.getElementById('progress');
const visitor=document.getElementById('visitor');
const dayLabel=document.getElementById('dayLabel');
const time=document.getElementById('time');
const iVisitor=document.getElementById('iVisitor');
const iTask=document.getElementById('iTask');
const iNext=document.getElementById('iNext');
const iDone=document.getElementById('iDone');
const startEpoch=Date.now();

function polar(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return {x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}}
function arcPath(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a1),p1=polar(cx,cy,r,a0);const large=(a1-a0)<=180?0:1;return `M ${p0.x} ${p0.y} A ${r} ${r} 0 ${large} 0 ${p1.x} ${p1.y}`}

for(let i=0;i<=36;i++){
  const a=-72+144*i/36;
  const p1=polar(500,540,276,a), p2=polar(500,540,i%6===0?252:260,a);
  const l=document.createElementNS(svgNS,'line');l.setAttribute('x1',p1.x);l.setAttribute('y1',p1.y);l.setAttribute('x2',p2.x);l.setAttribute('y2',p2.y);l.setAttribute('class','tick '+(i%6===0?'major':''));ticks.appendChild(l)
}

const segs=[];
for(let i=0;i<tasks.length;i++){
  const a0=-70+i*14.1,a1=a0+11.8,mid=(a0+a1)/2;
  const p=document.createElementNS(svgNS,'path');p.setAttribute('d',arcPath(500,540,372,a0,a1));p.setAttribute('fill','none');p.setAttribute('stroke',colors[tasks[i][1]]);p.setAttribute('stroke-width','54');p.setAttribute('stroke-linecap','round');p.setAttribute('class','taskSeg');taskG.appendChild(p);segs.push(p);
  const tp=polar(500,540,372,mid);
  const t=document.createElementNS(svgNS,'text');t.setAttribute('x',tp.x);t.setAttribute('y',tp.y-2);t.setAttribute('class','taskText');t.textContent=tasks[i][0];taskG.appendChild(t)
}

function update(){
  const elapsed=Date.now()-startEpoch;
  const dayIndex=Math.floor(elapsed/DAY_MS);
  const p=(elapsed%DAY_MS)/DAY_MS;
  const hour=6+6*p;
  const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60);
  const current=Math.min(9,Math.floor(p*10));
  const done=Math.floor(p*10);
  needle.setAttribute('transform',`rotate(${-72+144*p} 500 540)`);
  progress.setAttribute('stroke-dashoffset',String(100-100*p));
  time.textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  const v=visitors[dayIndex%visitors.length];
  visitor.textContent=v; dayLabel.textContent=`DIA ${dayIndex+1}`; iVisitor.textContent=v;
  iTask.textContent=tasks[current][0]; iNext.textContent=current<9?tasks[current+1][0]:'Encerramento do turno'; iDone.textContent=`${done}/10`;
  segs.forEach((s,i)=>{s.setAttribute('class','taskSeg'+(i===current?' active':'')+(i<current?' done':''))});
}
update();
setInterval(update,50);
</script>
</body>
</html>
