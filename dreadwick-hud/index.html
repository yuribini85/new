<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dreadwick HUD — Canvas</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0e10;font-family:Georgia,serif}
#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,#30464d 0,#18262b 42%,#0b1012 77%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#debug{position:absolute;top:env(safe-area-inset-top,0);right:10px;margin-top:10px;padding:8px 10px;background:rgba(8,10,10,.62);border:1px solid rgba(230,220,200,.14);color:#d9d0bf;font:11px/1.45 Arial,sans-serif;z-index:2;pointer-events:none}
#debug b{color:#fff0d3}
#title{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);color:#bbb3a5;font:9px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="title">Dreadwick Light Station · Canvas Test</div>
  <div id="debug">
    <div><b>Visitante:</b> <span id="dv"></span></div>
    <div><b>Tarefa:</b> <span id="dt"></span></div>
    <div><b>Hora:</b> <span id="dh"></span></div>
    <div><b>Concluídas:</b> <span id="dd"></span></div>
  </div>
</div>
<script>
(function(){
'use strict';
var DAY_MS=60000;
var visitors=['THOMAS','BETSY','STEWART','MARGARET','DOUGLAS','EILEEN','ANGUS','MAIRI'];
var tasks=[
 ['Limpar lente','player'],['Inspecionar gerador','auto'],['Reabastecer','player'],['Checar cais','auto'],['Patrulhar costa','player'],['Regular mecanismo','auto'],['Limpar vidros','player'],['Registrar clima','auto'],['Verificar rádio','player'],['Recolher suprimentos','auto']
];
var colors={player:'#214a64',auto:'#7d342a'};
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d',{alpha:false});
var dv=document.getElementById('dv'),dt=document.getElementById('dt'),dh=document.getElementById('dh'),dd=document.getElementById('dd');
var start=Date.now();
var W=0,H=0,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function point(cx,cy,r,p){
  var a=Math.PI-(Math.PI*p);
  return {x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)};
}
function arc(cx,cy,r,p0,p1){
  ctx.beginPath();
  ctx.arc(cx,cy,r,Math.PI-Math.PI*p0,Math.PI-Math.PI*p1,true);
}
function fitText(text,maxWidth,base){
  var s=base;ctx.font=s+'px Georgia';
  while(s>8 && ctx.measureText(text).width>maxWidth){s--;ctx.font=s+'px Georgia';}
  return s;
}
function drawInstrument(p,dayIndex,current){
  var mobile=W<700;
  var scale=Math.min(W/1000,H/650);
  if(mobile) scale=Math.min(W/760,H/650);
  var cx=W/2;
  var cy=H-(mobile?10:20);
  var R=Math.min(W*(mobile?.72:.46),H*.62);
  if(R<220) R=220;

  // fog/world wash
  ctx.fillStyle='#0b1012';ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(cx,H*.44,20,cx,H*.44,Math.max(W,H)*.75);
  g.addColorStop(0,'#30464d');g.addColorStop(.45,'#17252a');g.addColorStop(1,'#090d0f');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // outer metal arcs
  ctx.save();
  ctx.lineCap='butt';
  ctx.lineWidth=56;ctx.strokeStyle='#31352f';arc(cx,cy,R,.02,.98);ctx.stroke();
  ctx.lineWidth=5;ctx.strokeStyle='#9c9078';arc(cx,cy,R+28,.02,.98);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle='#c0b49a';arc(cx,cy,R+21,.02,.98);ctx.stroke();

  // task band
  var taskR=R-36;
  for(var i=0;i<10;i++){
    var a0=i/10+.008,a1=(i+1)/10-.008;
    ctx.globalAlpha=i<current?.18:(i===current?1:.82);
    ctx.lineWidth=i===current?52:42;
    ctx.strokeStyle=colors[tasks[i][1]];
    arc(cx,cy,taskR,a0,a1);ctx.stroke();
    ctx.globalAlpha=1;

    var mid=point(cx,cy,taskR,(i+.5)/10);
    var fs=fitText(tasks[i][0],70,mobile?10:12);
    ctx.font=fs+'px Georgia';ctx.fillStyle='#efe6d6';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(tasks[i][0],mid.x,mid.y);
  }

  // inner dial background
  ctx.lineWidth=72;ctx.strokeStyle='#d2c6ae';arc(cx,cy,R-112,.04,.96);ctx.stroke();
  ctx.lineWidth=62;ctx.strokeStyle='#2b302d';arc(cx,cy,R-154,.05,.95);ctx.stroke();

  // day/night sectors
  ctx.globalAlpha=.72;
  ctx.lineWidth=48;ctx.strokeStyle='#30383a';arc(cx,cy,R-196,.06,.5);ctx.stroke();
  ctx.strokeStyle='#c8bda6';arc(cx,cy,R-196,.5,.94);ctx.stroke();
  ctx.globalAlpha=1;

  // ticks
  for(var t=0;t<=36;t++){
    var tp=t/36;
    var outer=point(cx,cy,R-178,tp);
    var inner=point(cx,cy,R-(t%6===0?206:198),tp);
    ctx.beginPath();ctx.moveTo(outer.x,outer.y);ctx.lineTo(inner.x,inner.y);
    ctx.strokeStyle='#30322d';ctx.lineWidth=t%6===0?2:1;ctx.stroke();
  }

  // progress arc
  ctx.lineWidth=7;ctx.strokeStyle='#5d584c';arc(cx,cy,R-232,0,1);ctx.stroke();
  ctx.lineWidth=9;ctx.strokeStyle='#a98d59';ctx.lineCap='round';arc(cx,cy,R-232,0,p);ctx.stroke();ctx.lineCap='butt';

  // moon/sun markers
  var lp=point(cx,cy,R-220,.03),rp=point(cx,cy,R-220,.97);
  ctx.textAlign='center';ctx.fillStyle='#222521';ctx.font='bold '+(mobile?25:31)+'px Georgia';
  ctx.fillText('6',lp.x,lp.y+18);ctx.fillText('12',rp.x,rp.y+18);
  ctx.font=(mobile?24:30)+'px Georgia';ctx.fillText('☾',lp.x,lp.y-18);ctx.fillText('☼',rp.x,rp.y-18);

  // visitor core plate
  var coreR=R-292;
  if(coreR<105) coreR=105;
  ctx.beginPath();ctx.arc(cx,cy,coreR,Math.PI,0);ctx.closePath();ctx.fillStyle='#cec1a9';ctx.fill();
  ctx.strokeStyle='#4d4a40';ctx.lineWidth=2;ctx.stroke();

  var visitor=visitors[dayIndex%visitors.length];
  ctx.fillStyle='#282922';ctx.textAlign='center';
  ctx.font=(mobile?10:12)+'px Arial';ctx.fillText('V I S I T A N T E',cx,cy-coreR*.62);
  ctx.font='bold '+(mobile?24:34)+'px Georgia';ctx.fillText(visitor,cx,cy-coreR*.34);
  ctx.font=(mobile?10:12)+'px Arial';ctx.fillText('DIA '+(dayIndex+1),cx,cy-coreR*.12);

  // needle: direct Canvas drawing, no SVG/CSS transform
  var tip=point(cx,cy,R-208,p);
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tip.x+3,tip.y+3);ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=9;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(tip.x,tip.y);ctx.strokeStyle='#ead19a';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.arc(tip.x,tip.y,7,0,Math.PI*2);ctx.fillStyle='#f1d99f';ctx.fill();ctx.strokeStyle='#28251f';ctx.lineWidth=2;ctx.stroke();

  // hub
  ctx.beginPath();ctx.arc(cx,cy,34,0,Math.PI*2);ctx.fillStyle='#252824';ctx.fill();ctx.strokeStyle='#aa8a58';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fillStyle='#b6955e';ctx.fill();
  ctx.restore();
}

function frame(){
  var elapsed=Date.now()-start;
  var dayIndex=Math.floor(elapsed/DAY_MS);
  var p=(elapsed%DAY_MS)/DAY_MS;
  var current=Math.min(9,Math.floor(p*10));
  var done=Math.floor(p*10);
  var h=6+6*p,hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  var time=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  drawInstrument(p,dayIndex,current);
  dv.textContent=visitors[dayIndex%visitors.length];dt.textContent=tasks[current][0];dh.textContent=time;dd.textContent=done+'/10';
}

resize();frame();
window.addEventListener('resize',function(){resize();frame();});
window.addEventListener('orientationchange',function(){setTimeout(function(){resize();frame();},250);});
setInterval(frame,80);
})();
</script>
</body>
</html>
