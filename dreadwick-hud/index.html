<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dreadwick HUD</title>
<style>
html,body{margin:0;height:100%;background:#0b0f10;overflow:hidden;font-family:Georgia,serif;color:#e7dcc6}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 45%,#2d4148 0,#172328 42%,#0a0f11 76%)}
#hud{position:absolute;left:50%;bottom:-2vh;transform:translateX(-50%);width:min(1100px,145vw);height:auto;filter:drop-shadow(0 -12px 28px rgba(0,0,0,.55))}
#info{position:absolute;top:18px;right:18px;font:11px Arial,sans-serif;line-height:1.5;color:#cfc6b4;background:rgba(10,12,12,.55);border:1px solid rgba(230,220,200,.15);padding:10px 12px;z-index:20}
#info b{color:#f2e8d6}.top{position:absolute;left:18px;top:18px;font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#bcb4a7;z-index:20}
.taskText{font-size:18px;fill:#f0e7d6;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.dialText{fill:#272823;text-anchor:middle}.small{font-size:13px;letter-spacing:4px}.visitor{font-size:38px;font-weight:bold}.hour{font-size:31px;font-weight:bold}.time{font-size:20px;fill:#e7dcc6;text-anchor:middle;font-family:Arial,sans-serif}.tick{stroke:#373a33;stroke-width:1}.tick.major{stroke-width:2}.taskSeg{stroke:#1b1d1a;stroke-width:2}.progressBase{fill:none;stroke:#5c584d;stroke-width:8}.progressFill{fill:none;stroke:#a88e59;stroke-width:9;stroke-linecap:round}.hubOuter{fill:#222521;stroke:#a38758;stroke-width:5}.hubInner{fill:#b3955c}.night{fill:#2a3030}.day{fill:#d4c8b1}.core{fill:#cfc2aa;stroke:#555247;stroke-width:2}
@media(max-width:700px){#info{font-size:9px;top:44px;right:10px}.top{font-size:8px;left:10px}.taskText{font-size:13px}.visitor{font-size:30px}.hour{font-size:26px}.time{font-size:16px}}
</style>
</head>
<body>
<div id="wrap">
  <div class="top">Dreadwick Light Station · HUD de Rotina</div>
  <div id="info">
    <div><b>Visitante:</b> <span id="iVisitor"></span></div>
    <div><b>Em execução:</b> <span id="iTask"></span></div>
    <div><b>Próxima:</b> <span id="iNext"></span></div>
    <div><b>Concluídas:</b> <span id="iDone"></span></div>
  </div>

  <svg id="hud" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#918773"/><stop offset=".08" stop-color="#3a3d38"/><stop offset=".13" stop-color="#b7aa91"/><stop offset=".18" stop-color="#30332e"/><stop offset="1" stop-color="#1d211e"/></linearGradient>
    </defs>

    <path d="M40 540 A460 460 0 0 1 960 540 L900 540 A400 400 0 0 0 100 540 Z" fill="url(#metal)" stroke="#161815" stroke-width="3"/>
    <path d="M95 540 A405 405 0 0 1 905 540 L835 540 A335 335 0 0 0 165 540 Z" fill="#d2c5ad" stroke="#23251f" stroke-width="2"/>
    <path d="M165 540 A335 335 0 0 1 835 540 L790 540 A290 290 0 0 0 210 540 Z" fill="#252925" stroke="#171916" stroke-width="2"/>

    <path class="night" d="M210 540 A290 290 0 0 1 500 250 L500 540 Z" opacity=".52"/>
    <path class="day" d="M500 250 A290 290 0 0 1 790 540 L500 540 Z" opacity=".92"/>

    <g id="ticks"></g>
    <g id="tasks"></g>

    <path class="progressBase" d="M245 540 A255 255 0 0 1 755 540"/>
    <path id="progress" class="progressFill" d="M245 540"/>

    <text x="245" y="493" class="dialText hour">6</text>
    <text x="245" y="454" class="dialText" style="font-size:30px">☾</text>
    <text x="755" y="493" class="dialText hour">12</text>
    <text x="755" y="454" class="dialText" style="font-size:30px">☼</text>

    <path d="M330 540 A170 170 0 0 1 670 540 L650 540 A150 150 0 0 0 350 540 Z" class="core"/>
    <text x="500" y="420" class="dialText small">VISITANTE</text>
    <text id="visitor" x="500" y="462" class="dialText visitor">THOMAS</text>
    <text id="dayLabel" x="500" y="491" class="dialText" style="font-size:13px;font-family:Arial,sans-serif;letter-spacing:2px">DIA 1</text>
    <text id="time" x="500" y="520" class="time">06:00</text>

    <!-- Needle is intentionally drawn after the core so it can never be hidden by the dial layers. -->
    <line id="needleShadow" x1="500" y1="540" x2="258" y2="464" stroke="#111" stroke-width="9" stroke-linecap="round" opacity=".55"/>
    <line id="needle" x1="500" y1="540" x2="258" y2="464" stroke="#d7bd83" stroke-width="5" stroke-linecap="round"/>
    <circle id="needleTip" cx="258" cy="464" r="7" fill="#e2c98f" stroke="#28251f" stroke-width="3"/>

    <circle cx="500" cy="540" r="35" class="hubOuter"/>
    <circle cx="500" cy="540" r="11" class="hubInner"/>
  </svg>
</div>
<script>
(function(){
'use strict';
var DAY_MS=60000;
var visitors=['THOMAS','BETSY','STEWART','MARGARET','DOUGLAS','EILEEN','ANGUS','MAIRI'];
var tasks=[
 ['Limpar lente','player'],['Inspecionar gerador','auto'],['Reabastecer','player'],['Checar cais','auto'],['Patrulhar costa','player'],['Regular mecanismo','auto'],['Limpar vidros','player'],['Registrar clima','auto'],['Verificar rádio','player'],['Recolher suprimentos','auto']
];
var colors={player:'#214a64',auto:'#7d342a'};
var svgNS='http://www.w3.org/2000/svg';
var ticks=document.getElementById('ticks');
var taskG=document.getElementById('tasks');
var needle=document.getElementById('needle');
var needleShadow=document.getElementById('needleShadow');
var needleTip=document.getElementById('needleTip');
var progress=document.getElementById('progress');
var visitor=document.getElementById('visitor');
var dayLabel=document.getElementById('dayLabel');
var timeEl=document.getElementById('time');
var iVisitor=document.getElementById('iVisitor');
var iTask=document.getElementById('iTask');
var iNext=document.getElementById('iNext');
var iDone=document.getElementById('iDone');
var startEpoch=Date.now();

function pointOnArc(cx,cy,r,progressValue){
  var angle=Math.PI-(Math.PI*progressValue); // left -> top -> right
  return {x:cx+r*Math.cos(angle),y:cy-r*Math.sin(angle)};
}

for(var i=0;i<=36;i++){
  var p=i/36;
  var a=pointOnArc(500,540,276,p);
  var b=pointOnArc(500,540,(i%6===0?252:260),p);
  var l=document.createElementNS(svgNS,'line');
  l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);
  l.setAttribute('class','tick '+(i%6===0?'major':''));ticks.appendChild(l);
}

var segs=[];
for(var j=0;j<tasks.length;j++){
  var start=j/10+0.008,end=(j+1)/10-0.008;
  var p1=pointOnArc(500,540,372,start),p2=pointOnArc(500,540,372,end);
  var path=document.createElementNS(svgNS,'path');
  path.setAttribute('d','M '+p1.x+' '+p1.y+' A 372 372 0 0 0 '+p2.x+' '+p2.y);
  path.setAttribute('fill','none');path.setAttribute('stroke',colors[tasks[j][1]]);path.setAttribute('stroke-width','54');path.setAttribute('stroke-linecap','butt');path.setAttribute('opacity','1');
  taskG.appendChild(path);segs.push(path);
  var mid=pointOnArc(500,540,372,(j+.5)/10);
  var txt=document.createElementNS(svgNS,'text');txt.setAttribute('x',mid.x);txt.setAttribute('y',mid.y+5);txt.setAttribute('class','taskText');txt.textContent=tasks[j][0];taskG.appendChild(txt);
}

function buildProgress(p){
  if(p<=0){progress.setAttribute('d','M 245 540');return;}
  var end=pointOnArc(500,540,255,p);
  progress.setAttribute('d','M 245 540 A 255 255 0 '+(p>0.5?1:0)+' 0 '+end.x+' '+end.y);
}

function update(){
  var elapsed=Date.now()-startEpoch;
  var dayIndex=Math.floor(elapsed/DAY_MS);
  var p=(elapsed%DAY_MS)/DAY_MS;
  var hour=6+6*p;
  var hh=Math.floor(hour),mm=Math.floor((hour-hh)*60);
  var current=Math.min(9,Math.floor(p*10));
  var done=Math.floor(p*10);

  var tip=pointOnArc(500,540,258,p);
  needle.setAttribute('x2',tip.x);needle.setAttribute('y2',tip.y);
  needleShadow.setAttribute('x2',tip.x+3);needleShadow.setAttribute('y2',tip.y+3);
  needleTip.setAttribute('cx',tip.x);needleTip.setAttribute('cy',tip.y);
  buildProgress(p);

  timeEl.textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  var v=visitors[dayIndex%visitors.length];
  visitor.textContent=v;dayLabel.textContent='DIA '+(dayIndex+1);iVisitor.textContent=v;
  iTask.textContent=tasks[current][0];iNext.textContent=current<9?tasks[current+1][0]:'Encerramento do turno';iDone.textContent=done+'/10';

  for(var k=0;k<segs.length;k++){
    if(k<current){segs[k].setAttribute('opacity','.18');segs[k].setAttribute('stroke-width','54');}
    else if(k===current){segs[k].setAttribute('opacity','1');segs[k].setAttribute('stroke-width','64');}
    else{segs[k].setAttribute('opacity','.82');segs[k].setAttribute('stroke-width','54');}
  }
}

update();
window.setInterval(update,100);
})();
</script>
</body>
</html>
