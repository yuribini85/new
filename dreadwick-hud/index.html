<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Dreadwick HUD CSS</title><style>
:root{
--bone:#eee8d7;
--bone-soft:#cfc8b7;
--bone-dim:#9c998f;
--sea:#0d171a;
--sea-2:#111d20;
--amber:#c99a42;
--red:#a85349;
--blue:#476d7c;
--line:rgba(238,232,215,.28);
--line-strong:rgba(238,232,215,.46);
--cream:#eee8d7;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090a;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
body{touch-action:manipulation}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(123,143,146,.18),transparent 34%),linear-gradient(#172528 0%,#0f1a1d 54%,#081215 100%)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 46%,rgba(0,0,0,.18) 100%),linear-gradient(to top,rgba(3,5,5,.72) 0 16%,rgba(4,7,8,.08) 54%,rgba(4,6,7,.34) 100%);pointer-events:none}
.testbar{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;z-index:50;display:flex;gap:5px}
.testbar button{border:1px solid rgba(238,232,215,.18);background:rgba(12,19,20,.40);color:var(--bone-soft);padding:7px 8px;border-radius:3px;font:9px Arial,sans-serif;letter-spacing:.08em}
.testbar button.on{color:var(--bone);border-color:rgba(201,154,66,.55);background:rgba(16,24,25,.58)}
.instrument{position:absolute;left:50%;bottom:-1.5vh;transform:translateX(-50%);width:min(980px,145vw);aspect-ratio:2/1;overflow:visible;filter:drop-shadow(0 -8px 18px rgba(0,0,0,.42))}
.circle{position:absolute;left:0;bottom:-100%;width:100%;aspect-ratio:1/1;border-radius:50%}
.outer{background:radial-gradient(circle at 50% 50%,transparent 0 40.2%,#070b0c 40.4% 41.5%,rgba(238,232,215,.14) 41.7% 42.0%,#192225 42.2% 46.8%,#0a0f10 47% 49.3%,rgba(238,232,215,.18) 49.5% 49.8%,#12191b 50% 53.5%,transparent 53.8%)}
.outer:before,.outer:after{content:"";position:absolute;border-radius:50%;inset:2.4%;border:1px solid rgba(238,232,215,.24)}
.outer:after{inset:7%;border-color:rgba(238,232,215,.08)}
.dial{bottom:-91%;left:9%;width:82%;background:conic-gradient(from 270deg,#152125 0 90deg,#c9c3b3 90deg 180deg,transparent 180deg 360deg);box-shadow:inset 0 0 0 7px #0d1416,inset 0 0 0 9px rgba(238,232,215,.18),inset 0 0 0 13px #121a1c}
.dial:after{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid rgba(238,232,215,.22);box-shadow:inset 0 0 34px rgba(0,0,0,.12)}
.night-text,.day-text{position:absolute;z-index:10;color:#202725;text-align:center;line-height:1}
.night-text{left:24%;bottom:8.5%}.day-text{right:24%;bottom:8.5%}
.num{display:block;font-size:clamp(28px,8vw,66px);font-weight:700}
.moon,.sun{display:block;margin:auto auto 4px;position:relative;width:clamp(22px,5vw,42px);height:clamp(22px,5vw,42px)}
.moon{border-radius:50%;background:var(--bone);box-shadow:0 0 10px rgba(238,221,177,.35)}
.moon:after{content:"";position:absolute;width:82%;height:82%;border-radius:50%;background:#152125;left:34%;top:-4%}
.sun{border-radius:50%;background:#303733;box-shadow:0 -23px 0 -17px #303733,0 23px 0 -17px #303733,23px 0 0 -17px #303733,-23px 0 0 -17px #303733,16px 16px 0 -17px #303733,-16px 16px 0 -17px #303733,16px -16px 0 -17px #303733,-16px -16px 0 -17px #303733}
.tick-ring{position:absolute;left:50%;bottom:0;width:82%;height:164%;transform:translateX(-50%);z-index:7;pointer-events:none}
.tick{position:absolute;left:50%;bottom:0;width:1px;height:45%;transform-origin:50% 100%;opacity:.75}
.tick:before{content:"";position:absolute;top:0;left:0;width:2px;height:9px;background:rgba(238,232,215,.34)}
.tick.major:before{height:17px;width:3px}
.task-rail{position:absolute;left:50%;bottom:0;width:100%;height:100%;transform:translateX(-50%);z-index:14;pointer-events:none}
.task{position:absolute;left:50%;top:0;width:clamp(78px,14vw,112px);height:clamp(50px,7.6vw,64px);border-radius:10px;border:1px solid var(--taskAccent,rgba(238,232,215,.28));clip-path:polygon(3% 5%,94% 0,100% 15%,97% 91%,10% 100%,0 84%,2% 28%);background:linear-gradient(180deg,rgba(18,27,28,.84),rgba(13,20,21,.74));box-shadow:0 4px 10px rgba(0,0,0,.24),inset 0 0 0 1px rgba(255,255,255,.015);transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1));opacity:var(--o,0);transition:transform .65s cubic-bezier(.2,.75,.2,1),opacity .45s ease;overflow:visible;color:var(--bone);text-align:center;display:flex;align-items:center;justify-content:center}
.task.player{--taskAccent:rgba(71,109,124,.92);box-shadow:inset 0 -3px 0 rgba(71,109,124,.72),0 4px 10px rgba(0,0,0,.24)}
.task.auto{--taskAccent:rgba(168,83,73,.92);box-shadow:inset 0 -3px 0 rgba(168,83,73,.72),0 4px 10px rgba(0,0,0,.24)}
.task.current{box-shadow:inset 0 -3px 0 var(--taskAccent),0 0 0 1px rgba(238,232,215,.30),0 5px 14px rgba(0,0,0,.40);z-index:4}
.task-label{position:absolute;left:50%;top:-24px;transform:translateX(-50%) rotate(-.4deg);width:max-content;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bone-soft);font:clamp(10px,1.8vw,14px) Georgia,"Times New Roman",serif;text-shadow:0 1px 2px rgba(0,0,0,.92),0 0 5px rgba(0,0,0,.38);letter-spacing:.01em;opacity:.82}
.task.current .task-label{color:var(--bone);font-weight:700;opacity:1;font-size:clamp(11px,2vw,15px)}
.task-icon{position:relative;width:29px;height:29px;color:var(--bone);filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));opacity:.88;transform:rotate(-1deg)}
.task.current .task-icon{transform:scale(1.08) rotate(.4deg);opacity:1}
.task-icon:before,.task-icon:after{content:"";position:absolute;display:block;box-sizing:border-box}
.icon-lens:before{width:22px;height:22px;border:2px solid currentColor;border-radius:50%;left:4px;top:4px;box-shadow:inset 0 0 0 3px rgba(238,226,201,.12)}
.icon-lens:after{width:8px;height:2px;background:currentColor;right:0;bottom:3px;transform:rotate(45deg);transform-origin:left center}
.icon-fuel:before{left:6px;top:7px;width:19px;height:21px;border:2px solid currentColor;border-radius:3px}
.icon-fuel:after{left:11px;top:2px;width:11px;height:8px;border:2px solid currentColor;border-bottom:0;border-radius:3px 3px 0 0;box-shadow:11px 5px 0 -3px currentColor}
.icon-lighthouse:before{left:10px;top:8px;width:12px;height:20px;border:2px solid currentColor;clip-path:polygon(18% 100%,82% 100%,100% 0,0 0)}
.icon-lighthouse:after{left:7px;top:2px;width:18px;height:8px;border:2px solid currentColor;border-radius:4px 4px 2px 2px;box-shadow:0 7px 0 -3px currentColor}
.icon-weather:before{left:4px;top:11px;width:24px;height:12px;border:2px solid currentColor;border-radius:10px}
.icon-weather:after{left:9px;top:5px;width:11px;height:11px;border:2px solid currentColor;border-radius:50%;background:inherit;box-shadow:-1px 20px 0 -4px currentColor,7px 20px 0 -4px currentColor,15px 20px 0 -4px currentColor}
.icon-dock:before{left:4px;top:12px;width:24px;height:3px;background:currentColor;box-shadow:0 7px 0 currentColor}
.icon-dock:after{left:7px;top:7px;width:3px;height:22px;background:currentColor;box-shadow:8px 0 0 currentColor,16px 0 0 currentColor}
.icon-gear:before{content:"⚙";inset:-2px;font:30px/31px Georgia,serif;color:currentColor;text-align:center}
.icon-gear:after{display:none}
.icon-fish:before{left:4px;top:9px;width:19px;height:14px;border:2px solid currentColor;border-radius:60% 45% 45% 60%}
.icon-fish:after{right:1px;top:8px;width:11px;height:16px;border-left:9px solid currentColor;border-top:8px solid transparent;border-bottom:8px solid transparent}
.icon-radio:before{left:4px;top:9px;width:24px;height:18px;border:2px solid currentColor;border-radius:3px;background:radial-gradient(circle at 17px 9px,currentColor 0 2px,transparent 2.5px)}
.icon-radio:after{left:8px;top:1px;width:2px;height:12px;background:currentColor;transform:rotate(-25deg);transform-origin:bottom}
.icon-window:before{left:5px;top:4px;width:22px;height:25px;border:2px solid currentColor;background:linear-gradient(90deg,transparent 47%,currentColor 48% 52%,transparent 53%),linear-gradient(0deg,transparent 47%,currentColor 48% 52%,transparent 53%)}
.icon-window:after{display:none}
.icon-crate:before{left:5px;top:5px;width:22px;height:22px;border:2px solid currentColor;background:linear-gradient(45deg,transparent 46%,currentColor 47% 53%,transparent 54%),linear-gradient(-45deg,transparent 46%,currentColor 47% 53%,transparent 54%)}
.icon-crate:after{display:none}
.task .progress{position:absolute;left:7px;right:7px;bottom:5px;height:3px;background:rgba(238,232,215,.10);overflow:hidden;transform:rotate(-.15deg)}
.task .progress i{display:block;width:var(--p,0%);height:100%;background:var(--taskAccent);transition:width .12s linear}
.center-mark{position:absolute;left:50%;top:-1px;transform:translateX(-50%);z-index:16;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--amber);opacity:.9;filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.visitor{position:absolute;left:50%;bottom:22%;transform:translateX(-50%) rotate(-.12deg);z-index:18;width:38%;min-width:170px;text-align:center;color:var(--bone);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.72)}
.visitor .cap{font:600 clamp(8px,1.7vw,12px) Arial Narrow,Arial,sans-serif;letter-spacing:.18em;margin-bottom:4px;color:rgba(238,232,215,.68)}
.visitor .name{font:700 clamp(26px,6vw,52px)/.95 Georgia,"Times New Roman",serif;white-space:nowrap;color:var(--bone)}
.visitor .day{margin-top:7px;font:600 clamp(8px,1.55vw,11px) Arial Narrow,Arial,sans-serif;letter-spacing:.10em;color:rgba(238,232,215,.70)}
.visitor:before,.visitor:after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,rgba(238,232,215,.28),transparent);margin:0 auto 7px;width:78%}
.visitor:after{margin:8px auto 0}
.needle-wrap{position:absolute;left:50%;bottom:0;width:0;height:0;z-index:12;transform:rotate(var(--angle,-72deg));transition:transform .06s linear}
.needle{position:absolute;width:2px;height:clamp(120px,31vw,265px);bottom:0;left:-1px;transform-origin:50% 100%;background:var(--amber);clip-path:polygon(25% 100%,75% 100%,100% 11%,50% 0,0 11%);filter:drop-shadow(0 0 3px rgba(201,154,66,.20))}
.hub{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);z-index:20;width:clamp(22px,4.8vw,38px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--amber) 0 18%,#6c572f 20% 31%,#12191a 34% 68%,rgba(238,232,215,.20) 70% 74%,#12191a 76%);box-shadow:0 0 0 1px #070a0a,0 2px 6px rgba(0,0,0,.45)}
.basebar{position:absolute;left:2%;right:2%;bottom:0;height:12%;z-index:17;border-top:1px solid rgba(238,232,215,.22);background:linear-gradient(180deg,rgba(19,27,28,.88),rgba(9,14,15,.96));box-shadow:0 -2px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.02)}
.basebar:before,.basebar:after{content:"";position:absolute;top:36%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(238,232,215,.34) 0 18%,#1b2221 22% 58%,#090c0c 62%);box-shadow:0 1px 2px #000}
.basebar:before{left:2.2%}.basebar:after{right:2.2%}
.time-read{position:absolute;left:50%;bottom:3.7%;transform:translateX(-50%) rotate(.1deg);z-index:21;font:600 clamp(9px,2vw,13px) Arial Narrow,Arial,sans-serif;letter-spacing:.12em;color:var(--bone-soft);text-shadow:0 1px 2px rgba(0,0,0,.92)}
.legend{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;font:8px Arial,sans-serif;letter-spacing:.06em;color:var(--bone-dim);white-space:nowrap}
.legend b{font-weight:400}
.legend .b:before,.legend .r:before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin:0 4px 0 10px}
.legend .b:before{background:var(--blue)}.legend .r:before{background:var(--red)}
@media(max-width:480px){
.instrument{width:152vw}
.visitor{bottom:22%;width:38%;min-width:170px;color:var(--bone);text-shadow:0 1px 2px rgba(0,0,0,.72)}
.task{width:82px;height:54px}
.task-label{position:absolute;left:50%;top:-24px;transform:translateX(-50%) rotate(-.4deg);width:max-content;max-width:145px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bone-soft);font:clamp(10px,1.8vw,14px) Georgia,"Times New Roman",serif;text-shadow:0 1px 2px rgba(0,0,0,.92),0 0 5px rgba(0,0,0,.38);letter-spacing:.01em;opacity:.82}
.task.current .task-label{color:var(--bone);font-weight:700;opacity:1;font-size:clamp(11px,2vw,15px)}
.task-icon{position:relative;width:29px;height:29px;color:var(--bone);filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));opacity:.88;transform:rotate(-1deg)}
.task.current .task-icon{transform:scale(1.08) rotate(.4deg);opacity:1}
.legend{font-size:7px}
}
</style></head><body><div class="stage"><div class="testbar"><button id="demo" class="on">1 MIN</button><button id="canon">8 MIN</button></div><div class="instrument" id="instrument"><div class="circle outer"></div><div class="circle dial"></div><div class="tick-ring" id="ticks"></div><div class="task-rail" id="taskRail"><div class="center-mark"></div></div><div class="night-text"><span class="moon"></span><span class="num">6</span></div><div class="day-text"><span class="sun"></span><span class="num">12</span></div><div class="needle-wrap" id="needle"><div class="needle"></div></div><div class="visitor"><div class="cap">VISITANTE</div><div class="name" id="visitor">BETSY</div><div class="day" id="dayLabel">SEGUNDA · DIA 1</div></div><div class="basebar"></div><div class="hub"></div><div class="time-read" id="timeRead">06:00</div></div><div class="legend"><b class="b">JOGADOR</b><b class="r">QUINT</b></div></div><script>
(function(){
'use strict';
var DAY_REAL=60000, DAY_MIN=360, epoch=Date.now();
var visitors=['BETSY','DUNCAN','BETSY','DUNCAN','EDDIE','BETSY','SEM VISITANTE'];
var weekdays=['SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO','DOMINGO'];
var tasks=[
{name:'Limpar lente',type:'auto',dur:22,icon:'lens'},
{name:'Buscar querosene',type:'player',dur:34,icon:'fuel'},
{name:'Reabastecer farol',type:'auto',dur:28,icon:'lighthouse'},
{name:'Registrar clima',type:'player',dur:16,icon:'weather'},
{name:'Checar cais',type:'auto',dur:38,icon:'dock'},
{name:'Regular mecanismo',type:'player',dur:26,icon:'gear'},
{name:'Separar pescado',type:'player',dur:31,icon:'fish'},
{name:'Verificar rádio',type:'auto',dur:20,icon:'radio'},
{name:'Limpar vidros',type:'player',dur:18,icon:'window'},
{name:'Guardar suprimentos',type:'auto',dur:29,icon:'crate'}
];
var rail=document.getElementById('taskRail'),
needle=document.getElementById('needle'),
visitor=document.getElementById('visitor'),
dayLabel=document.getElementById('dayLabel'),
timeRead=document.getElementById('timeRead'),
demo=document.getElementById('demo'),
canon=document.getElementById('canon'),
instrument=document.getElementById('instrument');
var taskEls=[];
var totalTask=tasks.reduce(function(a,t){return a+t.dur},0);
for(var i=0;i<=30;i++){
var tick=document.createElement('i');
tick.className='tick '+(i%5===0?'major':'');
tick.style.transform='rotate('+(-72+144*i/30)+'deg)';
document.getElementById('ticks').appendChild(tick);
}
tasks.forEach(function(t){
var el=document.createElement('div');
el.className='task '+t.type;
el.innerHTML=
'<div class="task-label">'+t.name+'</div>'+
'<div class="task-icon icon-'+t.icon+'"></div>'+
'<div class="progress"><i></i></div>';
rail.appendChild(el);
taskEls.push(el);
});
function sim(){
var e=Date.now()-epoch;
var day=Math.floor(e/DAY_REAL),p=(e%DAY_REAL)/DAY_REAL;
return{day:day,p:p,min:p*DAY_MIN};
}
function taskState(min){
var q=(min/DAY_MIN)*totalTask,acc=0;
for(var i=0;i<tasks.length;i++){
var end=acc+tasks[i].dur;
if(q<end)return{index:i,progress:(q-acc)/tasks[i].dur};
acc=end;
}
return{index:tasks.length-1,progress:1};
}
function placeTasks(state){
var w=instrument.clientWidth,h=instrument.clientHeight;
var radius=w*.43,centerY=h*.98;
taskEls.forEach(function(el,i){
var rel=i-state.index;
if(rel < -2 || rel > 3){
el.style.setProperty('--o','0');
return;
}
var angle=-90+rel*29;
var rad=angle*Math.PI/180;
var x=Math.cos(rad)*radius;
var y=centerY+Math.sin(rad)*radius-h*.06;
var rot=angle+90;
var scale=rel===0?1.08:(Math.abs(rel)===1?.95:.86);
var opacity=rel===0?1:(Math.abs(rel)===1?.78:.38);
el.style.setProperty('--x',x+'px');
el.style.setProperty('--y',y+'px');
el.style.setProperty('--r',rot+'deg');
el.style.setProperty('--s',scale);
el.style.setProperty('--o',opacity);
el.classList.toggle('current',rel===0);
el.querySelector('.progress i').style.setProperty('--p',(rel===0?state.progress*100:0)+'%');
});
}
function update(){
var s=sim();
var hh=6+Math.floor(s.min/60),mm=Math.floor(s.min%60);
timeRead.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
needle.style.setProperty('--angle',(-72+144*s.p)+'deg');
var d=s.day%7;
visitor.textContent=visitors[d];
dayLabel.textContent=weekdays[d]+' · DIA '+(s.day+1);
placeTasks(taskState(s.min));
requestAnimationFrame(update);
}
function setSpeed(ms){
var s=sim(),absolute=s.day+s.p;
DAY_REAL=ms;
epoch=Date.now()-absolute*DAY_REAL;
demo.classList.toggle('on',ms===60000);
canon.classList.toggle('on',ms===480000);
}
demo.onclick=function(){setSpeed(60000)};
canon.onclick=function(){setSpeed(480000)};
window.addEventListener('resize',function(){placeTasks(taskState(sim().min))});
requestAnimationFrame(update);
})();
</script></body></html>
