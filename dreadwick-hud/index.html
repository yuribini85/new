<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dreadwick HUD — Protótipo Visual</title>
<style>
:root{
  --ivory:#ded3bd;
  --ivory2:#bfb29a;
  --ink:#171a18;
  --steel:#353934;
  --steel2:#1b1e1b;
  --edge:#817761;
  --blue:#214a64;
  --blue2:#153648;
  --red:#7d342a;
  --red2:#53231d;
  --gold:#a48753;
  --fog:#9ea7a7;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 50% 120%, rgba(161,176,178,.12), transparent 34%),
    linear-gradient(#121719,#090c0d 68%,#070808);
}
#game{
  position:relative;width:100vw;height:100vh;min-height:650px;overflow:hidden;
}
.world{
  position:absolute;inset:0;
  background:
    linear-gradient(to top,rgba(5,7,7,.97) 0 21%,rgba(7,9,10,.75) 35%,rgba(10,13,14,.28) 58%,rgba(7,9,10,.5) 100%),
    radial-gradient(ellipse at 50% 48%,#354a50 0%,#223238 30%,#121b1e 56%,#0a0f11 100%);
}
.world:before{
  content:"";position:absolute;left:50%;top:27%;width:min(48vw,520px);height:min(31vw,330px);transform:translateX(-50%);
  background:
    radial-gradient(ellipse at 50% 83%,#111513 0 37%,transparent 38%),
    linear-gradient(90deg, transparent 0 47.8%, #d7d0bd 47.8% 49.3%, #151715 49.3% 50.7%, #d7d0bd 50.7% 52.2%,transparent 52.2%);
  opacity:.28;filter:blur(.3px);
}
.world:after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay;pointer-events:none
}
.header{
  position:absolute;left:22px;right:22px;top:18px;display:flex;justify-content:space-between;
  font:10px/1.2 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#beb7aa;
  z-index:10
}
.readout{
  position:absolute;right:22px;top:50px;width:min(340px,58vw);
  padding:12px 14px;background:rgba(12,15,15,.58);
  border:1px solid rgba(226,215,193,.14);
  box-shadow:inset 0 0 22px rgba(255,255,255,.02);
  backdrop-filter:blur(5px);z-index:10;
  font:11px/1.45 Arial,sans-serif;color:#c8c0b2
}
.readout b{font-weight:600;color:#f0e7d5}
.readout .sep{height:1px;background:rgba(230,220,200,.12);margin:7px 0}

.hud{
  position:absolute;
  left:50%;
  bottom:-7.2vw;
  transform:translateX(-50%);
  width:min(1180px,126vw);
  aspect-ratio:2.15/1;
  z-index:5;
  filter:drop-shadow(0 -15px 28px rgba(0,0,0,.58));
}
.frame,.ring,.dial,.core,.queue-labels{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  border-radius:52% 52% 0 0 / 100% 100% 0 0;
}
.frame{
  width:100%;height:100%;
  background:
    linear-gradient(#9c927d 0 1.6%,#494b46 1.7% 3.6%,#b2a58e 3.7% 4.8%,#2f322e 4.9% 100%);
  border:1px solid #151715;
}
.frame:before{
  content:"";position:absolute;inset:3.4% 2.4% 0;
  border:1px solid rgba(222,211,188,.25);
  border-radius:52% 52% 0 0/100% 100% 0 0
}
.frame:after{
  content:"";position:absolute;inset:0;
  border-radius:inherit;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;pointer-events:none
}
.ring{
  width:92%;height:91%;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 100%,transparent 0 49%,rgba(0,0,0,.14) 49.5% 50.5%,transparent 51%),
    linear-gradient(#d3c6ae 0 30%,#595952 30.2% 31.5%,#222521 31.7% 100%);
  border:1px solid #1c1e1b;
}
.ring:before{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:88%;height:82%;border-radius:52% 52% 0 0/100% 100% 0 0;
  border-top:1px dashed rgba(45,43,37,.55);
}
.dial{
  width:70%;height:71%;
  background:
    radial-gradient(circle at 50% 100%,#2c2f2b 0 11.8%,#d8ceba 12.2% 100%);
  border:1px solid #34352f;
  box-shadow:inset 0 0 55px rgba(0,0,0,.16);
  overflow:hidden;
}
.dial:before{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:87%;height:84%;border-radius:52% 52% 0 0/100% 100% 0 0;
  background:conic-gradient(from 270deg at 50% 100%,
    rgba(32,37,40,.18) 0deg 58deg,
    rgba(184,157,94,.11) 58deg 122deg,
    rgba(120,83,47,.18) 122deg 180deg,
    transparent 180deg 360deg);
  pointer-events:none
}
.core{
  width:46%;height:45.5%;
  background:
    linear-gradient(rgba(255,255,255,.08),transparent 36%),
    #cec2aa;
  color:#252620;
  border:1px solid #4b493f;
  box-shadow:inset 0 0 34px rgba(0,0,0,.16);
  padding-top:6.2%;
  text-align:center
}
.core .cap{
  font-size:clamp(8px,1vw,14px);letter-spacing:.44em;margin-left:.44em;color:#514f46
}
.core .name{
  margin-top:.35em;font-size:clamp(20px,3vw,45px);letter-spacing:.06em;line-height:1
}
.core .sub{
  margin-top:.9em;font:10px Arial,sans-serif;letter-spacing:.12em;color:#5f5a4e
}
.island{
  position:relative;width:34%;height:18%;margin:.7em auto 0;border-top:1px solid rgba(0,0,0,.28)
}
.island:before{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:82%;height:54%;background:#49473f;clip-path:polygon(0 100%,8% 73%,18% 66%,27% 45%,38% 53%,47% 31%,56% 50%,66% 38%,77% 58%,88% 63%,100% 100%)
}
.island:after{
  content:"";position:absolute;left:50.5%;bottom:39%;width:2.2%;height:50%;background:#3c3b35;box-shadow:0 -6px 0 2px #3c3b35
}

.task{
  position:absolute;
  width:118px;height:60px;padding:7px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:8px;
  border:1px solid rgba(242,231,207,.34);
  color:#f0e7d7;text-align:center;font-size:11px;line-height:1.05;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),0 4px 10px rgba(0,0,0,.22);
  transform-origin:center;
  transition:opacity .35s,filter .35s,transform .35s
}
.task small{
  display:block;margin-top:4px;font:8px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.72
}
.task.player{background:linear-gradient(var(--blue),var(--blue2))}
.task.auto{background:linear-gradient(var(--red),var(--red2))}
.task.active{
  outline:2px solid #efe3c9;outline-offset:2px;filter:brightness(1.15);
  box-shadow:0 0 0 1px rgba(0,0,0,.45),0 0 16px rgba(218,204,176,.24),inset 0 0 0 1px rgba(255,255,255,.08)
}
.task.done{opacity:.2;filter:saturate(.15) brightness(.75)}

.tick{
  position:absolute;left:50%;bottom:0;width:1px;height:100%;transform-origin:50% 100%;pointer-events:none
}
.tick:before{
  content:"";position:absolute;top:3.5%;left:0;width:1px;height:4%;background:rgba(30,31,27,.55)
}
.tick.major:before{width:2px;height:7%;background:#22231f}
.marker{
  position:absolute;bottom:8.2%;width:72px;text-align:center;color:#282922;font-weight:bold;font-size:clamp(18px,2.7vw,37px)
}
.marker small{display:block;font-size:.54em;line-height:1;font-weight:normal;margin-bottom:2px}
.marker.left{left:4.1%}.marker.right{right:4.1%}

.day-arc{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:90%;height:88%;border-radius:52% 52% 0 0/100% 100% 0 0;
  pointer-events:none;
}
.day-arc:before{
  content:"";position:absolute;inset:0;border-radius:inherit;
  border-top:4px solid rgba(66,61,52,.22)
}
.needle{
  position:absolute;left:50%;bottom:0;width:3px;height:87%;
  background:linear-gradient(to top,#7e6943 0 13%,#252722 13% 100%);
  transform-origin:50% 100%;
  box-shadow:0 0 0 1px rgba(255,255,255,.08);
  transition:transform .08s linear;
}
.needle:before{
  content:"";position:absolute;left:-5px;top:-8px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:16px solid #1f211e
}
.needle:after{
  content:"";position:absolute;left:-2px;top:13%;width:7px;height:7px;border-radius:50%;background:#b1925b;box-shadow:0 0 0 2px #242622
}
.hub{
  position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);
  width:8.8%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#b9955b 0 14%,#272925 16% 38%,#aa8c59 40% 45%,#22241f 47% 100%);
  border:1px solid #111310;box-shadow:0 0 0 3px rgba(214,200,173,.18)
}
.time{
  position:absolute;left:50%;bottom:8.1%;transform:translateX(-50%);
  padding:5px 9px;border-radius:3px;background:#252824;color:#ded4c0;border:1px solid rgba(228,216,192,.2);
  font:10px Arial,sans-serif;letter-spacing:.12em
}
.progress{
  position:absolute;left:50%;bottom:3.6%;transform:translateX(-50%);
  width:31%;height:4px;background:rgba(18,20,18,.35);overflow:hidden
}
.progress>span{display:block;height:100%;width:0;background:#9b875e}

.legend{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  display:flex;gap:20px;font:9px Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#8f897f;z-index:11
}
.legend i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.legend .p i{background:var(--blue)} .legend .a i{background:var(--red)}

.flash{
  position:absolute;inset:0;background:#d7d0bd;opacity:0;pointer-events:none;z-index:20
}
.flash.on{animation:dayflash .9s ease}
@keyframes dayflash{0%{opacity:0}35%{opacity:.12}100%{opacity:0}}

@media(max-width:700px){
  .hud{width:158vw;bottom:-10.4vw}
  .task{width:90px;height:48px;font-size:8.5px;padding:5px 7px}
  .task small{font-size:6.5px}
  .readout{font-size:9px;top:47px}
  .header{font-size:8px}
  .legend{bottom:6px;font-size:7px}
}
</style>
</head>
<body>
<div id="game">
  <div class="world"></div>
  <div class="header">
    <div>Dreadwick Light Station · HUD de Rotina</div>
    <div id="dayTop">Dia 1</div>
  </div>

  <div class="readout">
    <div><b>Visitante na ilha</b> · <span id="sideVisitor"></span></div>
    <div class="sep"></div>
    <div><b>Em execução</b> · <span id="sideTask"></span></div>
    <div><b>Próxima tarefa</b> · <span id="sideNext"></span></div>
    <div><b>Fila concluída</b> · <span id="sideDone">0/10</span></div>
  </div>

  <div class="hud">
    <div class="frame"></div>
    <div class="ring" id="ring"></div>

    <div class="dial" id="dial">
      <div class="day-arc"></div>
      <div class="marker left"><small>☾</small>6</div>
      <div class="marker right"><small>☼</small>12</div>
      <div class="needle" id="needle"></div>
      <div class="time" id="time">06:00</div>
      <div class="progress"><span id="progressFill"></span></div>
    </div>

    <div class="core">
      <div class="cap">VISITANTE</div>
      <div class="name" id="visitor"></div>
      <div class="sub" id="dayCore"></div>
      <div class="island"></div>
    </div>

    <div class="hub"></div>
  </div>

  <div class="legend">
    <span class="p"><i></i>Jogador</span>
    <span class="a"><i></i>Quint</span>
  </div>
  <div class="flash" id="flash"></div>
</div>

<script>
const DAY_MS = 60_000;
const START_HOUR = 6;
const END_HOUR = 12;

const visitors = ["THOMAS","BETSY","STEWART","MARGARET","DOUGLAS","EILEEN","ANGUS","MAIRI"];

const tasks = [
  {name:"Limpar lente",type:"player",label:"Fila do jogador"},
  {name:"Inspecionar gerador",type:"auto",label:"Quint"},
  {name:"Reabastecer",type:"player",label:"Fila do jogador"},
  {name:"Checar cais",type:"auto",label:"Quint"},
  {name:"Patrulhar costa",type:"player",label:"Fila do jogador"},
  {name:"Regular mecanismo",type:"auto",label:"Quint"},
  {name:"Limpar vidros",type:"player",label:"Fila do jogador"},
  {name:"Registrar clima",type:"auto",label:"Quint"},
  {name:"Verificar rádio",type:"player",label:"Fila do jogador"},
  {name:"Recolher suprimentos",type:"auto",label:"Quint"}
];

const ring = document.getElementById("ring");
const dial = document.getElementById("dial");
const needle = document.getElementById("needle");
const timeEl = document.getElementById("time");
const visitorEl = document.getElementById("visitor");
const sideVisitor = document.getElementById("sideVisitor");
const sideTask = document.getElementById("sideTask");
const sideNext = document.getElementById("sideNext");
const sideDone = document.getElementById("sideDone");
const dayTop = document.getElementById("dayTop");
const dayCore = document.getElementById("dayCore");
const progressFill = document.getElementById("progressFill");
const flash = document.getElementById("flash");

let dayStart = performance.now();
let dayIndex = 0;
let lastDayIndex = 0;

function ticks(){
  for(let i=0;i<=48;i++){
    const e=document.createElement("div");
    e.className="tick "+(i%8===0?"major":"");
    e.style.transform=`translateX(-50%) rotate(${-74 + (148*i/48)}deg)`;
    dial.appendChild(e);
  }
}

function tasksOnArc(){
  tasks.forEach((t,i)=>{
    const e=document.createElement("div");
    e.className=`task ${t.type}`;
    e.dataset.index=i;
    e.innerHTML=`<span>${t.name}</span><small>${t.label}</small>`;

    const angleDeg = 202 + (136*i/(tasks.length-1));
    const a = angleDeg*Math.PI/180;
    const x = 50 + Math.cos(a)*44.2;
    const y = 96 + Math.sin(a)*39.2;
    e.style.left=`calc(${x}% - 59px)`;
    e.style.top=`calc(${y}% - 30px)`;
    e.style.transform=`rotate(${angleDeg+90}deg)`;
    ring.appendChild(e);
  });
}

function setDayVisual(d){
  const name=visitors[d%visitors.length];
  visitorEl.textContent=name;
  sideVisitor.textContent=name;
  dayTop.textContent=`Dia ${d+1}`;
  dayCore.textContent=`DIA ${d+1} · 06:00—12:00`;
}

function animate(now){
  let elapsed=now-dayStart;
  if(elapsed>=DAY_MS){
    const jump=Math.floor(elapsed/DAY_MS);
    dayIndex+=jump;
    dayStart+=jump*DAY_MS;
    elapsed=now-dayStart;
  }

  if(dayIndex!==lastDayIndex){
    flash.classList.remove("on");
    void flash.offsetWidth;
    flash.classList.add("on");
    setDayVisual(dayIndex);
    lastDayIndex=dayIndex;
  }

  const p=Math.min(.999999,Math.max(0,elapsed/DAY_MS));
  const hour=START_HOUR+(END_HOUR-START_HOUR)*p;
  const hh=Math.floor(hour);
  const mm=Math.floor((hour-hh)*60);
  timeEl.textContent=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;

  needle.style.transform=`rotate(${-72+144*p}deg)`;
  progressFill.style.width=`${p*100}%`;

  const current=Math.min(tasks.length-1,Math.floor(p*tasks.length));
  const done=Math.floor(p*tasks.length);
  document.querySelectorAll(".task").forEach((e,i)=>{
    e.classList.toggle("active",i===current);
    e.classList.toggle("done",i<current);
  });

  sideTask.textContent=tasks[current].name;
  sideNext.textContent=current<tasks.length-1?tasks[current+1].name:"Encerramento do turno";
  sideDone.textContent=`${Math.min(done,10)}/10`;

  requestAnimationFrame(animate);
}

ticks();
tasksOnArc();
setDayVisual(0);
requestAnimationFrame(animate);
</script>
</body>
</html>
