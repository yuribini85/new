<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dreadwick HUD</title>
<style>
:root{--ink:#1a1b18;--paper:#d7c9ad;--paper2:#bcae93;--metal:#3a3b36;--metal2:#20231f;--brass:#a88954;--brass2:#d7bd83;--blue:#24577a;--red:#8b372d;--cream:#efe5d2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f10;font-family:Georgia,serif;color:var(--cream)}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 42%,#32464d 0,#19252a 42%,#0a0e10 78%);overflow:hidden}
#topbar{position:absolute;z-index:10;top:max(14px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font:10px/1.25 Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#bdb4a6}
#topbar .info{background:rgba(8,11,11,.58);border:1px solid rgba(230,219,198,.13);padding:8px 10px;backdrop-filter:blur(4px)}
#topbar b{color:#efe4d0;font-weight:600}
#hudWrap{position:absolute;left:50%;bottom:-1.7vh;transform:translateX(-50%);width:min(920px,118vw);aspect-ratio:1.75/1}
#hud{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 30px rgba(0,0,0,.55))}
#taskLayer{position:absolute;inset:0;pointer-events:none}
.taskCard{position:absolute;left:50%;top:0;width:132px;height:72px;transform-origin:50% 440px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;border:2px solid #c8b48a;border-radius:14px;background:linear-gradient(#315f80,#1e4562);color:#f2e9d8;font:600 14px/1.08 Georgia,serif;box-shadow:inset 0 0 0 1px rgba(0,0,0,.32),0 3px 10px rgba(0,0,0,.35);opacity:.98}
.taskCard.auto{background:linear-gradient(#9b463b,#6f2c26)}
.taskCard.past{opacity:.18;filter:saturate(.5)}
.taskCard.future{opacity:.72}
.taskCard.current{height:82px;width:160px;border-width:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 0 18px rgba(222,193,130,.28),0 3px 10px rgba(0,0,0,.35)}
.taskCard .sub{position:absolute;left:10px;right:10px;bottom:7px;height:5px;border-radius:4px;background:rgba(14,18,18,.65);overflow:hidden}
.taskCard .fill{height:100%;width:0;background:var(--brass2)}
.taskCard .dur{position:absolute;right:7px;top:5px;font:9px Arial,sans-serif;opacity:.72}
.taskCard .label{max-width:122px}
#legend{position:absolute;z-index:12;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);font:8px Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:#8e887e;display:flex;gap:14px;white-space:nowrap}
#legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#legend .p{background:var(--blue)}#legend .a{background:var(--red)}
@media(max-width:600px){#hudWrap{width:138vw;bottom:-.8vh}.taskCard{width:110px;height:62px;font-size:11px;transform-origin:50% 375px}.taskCard.current{width:136px;height:72px}.taskCard .dur{font-size:8px}.taskCard .label{max-width:98px}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="info"><b id="dateText">SEGUNDA · DIA 1</b><br><span id="timeText">06:00</span></div>
    <div class="info">Ação: <b id="actionText">—</b><br>Visitante: <b id="visitorText">BETSY</b></div>
  </div>
  <div id="hudWrap">
    <svg id="hud" viewBox="0 0 1000 570" aria-label="HUD semicircular de Dreadwick">
      <defs>
        <linearGradient id="metalOuter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f816a"/><stop offset=".08" stop-color="#2c302d"/><stop offset=".15" stop-color="#b5a58a"/><stop offset=".23" stop-color="#292d29"/><stop offset="1" stop-color="#171a18"/></linearGradient>
        <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e1d6c0"/><stop offset="1" stop-color="#cbbda2"/></linearGradient>
        <linearGradient id="nightGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#283236"/><stop offset="1" stop-color="#111719"/></linearGradient>
        <linearGradient id="dayGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9cbae"/><stop offset="1" stop-color="#efe2bf"/></linearGradient>
      </defs>
      <path d="M40 540 A460 460 0 0 1 960 540 L905 540 A405 405 0 0 0 95 540 Z" fill="url(#metalOuter)" stroke="#101311" stroke-width="4"/>
      <path d="M84 540 A416 416 0 0 1 916 540 L870 540 A370 370 0 0 0 130 540 Z" fill="#1d211e" stroke="#a99165" stroke-width="4"/>
      <path d="M126 540 A374 374 0 0 1 874 540 L833 540 A333 333 0 0 0 167 540 Z" fill="url(#paperGrad)" stroke="#3b3b34" stroke-width="2"/>
      <path d="M112 540 A388 388 0 0 1 888 540" fill="none" stroke="#161a18" stroke-width="95"/>
      <path d="M112 540 A388 388 0 0 1 888 540" fill="none" stroke="#b0915e" stroke-width="3" opacity=".8"/>
      <path d="M132 540 A368 368 0 0 1 868 540" fill="none" stroke="#6f6553" stroke-width="1" opacity=".7"/>
      <path d="M195 540 A305 305 0 0 1 500 235 L500 540 Z" fill="url(#nightGrad)" opacity=".96"/>
      <path d="M500 235 A305 305 0 0 1 805 540 L500 540 Z" fill="url(#dayGrad)" opacity=".98"/>
      <path d="M195 540 A305 305 0 0 1 805 540" fill="none" stroke="#272a25" stroke-width="2"/>
      <g id="ticks"></g>
      <text x="255" y="430" text-anchor="middle" font-size="44" fill="#eee4cf">☾</text>
      <text x="255" y="488" text-anchor="middle" font-size="52" font-weight="700" fill="#eee4cf">6</text>
      <text x="745" y="430" text-anchor="middle" font-size="42" fill="#2a2923">☼</text>
      <text x="745" y="488" text-anchor="middle" font-size="52" font-weight="700" fill="#2a2923">12</text>
      <path d="M334 540 A166 166 0 0 1 666 540 L646 540 A146 146 0 0 0 354 540 Z" fill="#d9ccb3" stroke="#595446" stroke-width="2"/>
      <text x="500" y="389" text-anchor="middle" font-size="15" letter-spacing="4" fill="#4b463c">VISITANTE</text>
      <line x1="420" y1="400" x2="580" y2="400" stroke="#786f5d" stroke-width="1"/>
      <text id="visitorCore" x="500" y="445" text-anchor="middle" font-size="42" font-weight="700" fill="#25241f">BETSY</text>
      <text id="dayCore" x="500" y="474" text-anchor="middle" font-size="14" letter-spacing="2" fill="#5d5648">SEGUNDA · DIA 1</text>
      <text id="currentTaskCore" x="500" y="503" text-anchor="middle" font-size="13" fill="#4b463c">—</text>
      <line id="needleShadow" x1="500" y1="540" x2="314" y2="420" stroke="#0d0f0e" stroke-width="8" stroke-linecap="round" opacity=".5"/>
      <line id="needle" x1="500" y1="540" x2="314" y2="420" stroke="#d2b36e" stroke-width="4" stroke-linecap="round"/>
      <circle id="needleTip" cx="314" cy="420" r="6" fill="#d2b36e" stroke="#302c24" stroke-width="2"/>
      <circle cx="500" cy="540" r="20" fill="#242721" stroke="#a98b57" stroke-width="3"/>
      <circle cx="500" cy="540" r="6" fill="#b6985e"/>
    </svg>
    <div id="taskLayer"></div>
  </div>
  <div id="legend"><span><i class="p"></i>Jogador</span><span><i class="a"></i>Quint</span></div>
</div>
<script>
(function(){
'use strict';
var DAY_MS=60000;
var start=Date.now();
var visitors=['BETSY','DUNCAN','BETSY','DUNCAN','EDDIE','BETSY','SEM VISITANTE'];
var weekdays=['SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO','DOMINGO'];
var tasks=[
 {name:'Limpar lente',type:'auto',dur:22},
 {name:'Buscar querosene',type:'player',dur:34},
 {name:'Reabastecer farol',type:'player',dur:28},
 {name:'Registrar clima',type:'auto',dur:16},
 {name:'Checar cais',type:'player',dur:38},
 {name:'Regular mecanismo',type:'auto',dur:26},
 {name:'Separar pescado',type:'player',dur:31},
 {name:'Verificar rádio',type:'player',dur:20},
 {name:'Limpar vidros',type:'auto',dur:18},
 {name:'Guardar suprimentos',type:'player',dur:29}
];
var totalDur=tasks.reduce(function(a,t){return a+t.dur},0);
var taskLayer=document.getElementById('taskLayer');
var timeText=document.getElementById('timeText'),dateText=document.getElementById('dateText'),visitorText=document.getElementById('visitorText'),visitorCore=document.getElementById('visitorCore'),dayCore=document.getElementById('dayCore'),currentTaskCore=document.getElementById('currentTaskCore'),actionText=document.getElementById('actionText');
var needle=document.getElementById('needle'),needleShadow=document.getElementById('needleShadow'),needleTip=document.getElementById('needleTip');
var ticks=document.getElementById('ticks');
var svgNS='http://www.w3.org/2000/svg';
function polar(cx,cy,r,p){var a=Math.PI-Math.PI*p;return{x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)}}
for(var i=0;i<=24;i++){var p=.06+.88*i/24,a=polar(500,540,286,p),b=polar(500,540,i%4===0?263:270,p);var l=document.createElementNS(svgNS,'line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);l.setAttribute('stroke','#34362f');l.setAttribute('stroke-width',i%4===0?'2':'1');ticks.appendChild(l)}
var cards=tasks.map(function(t){var el=document.createElement('div');el.className='taskCard '+(t.type==='auto'?'auto':'player');el.innerHTML='<span class="dur">'+t.dur+'m</span><span class="label">'+t.name+'</span><div class="sub"><div class="fill"></div></div>';taskLayer.appendChild(el);return el});
function currentTaskIndex(dayProgress){var minute=dayProgress*totalDur,acc=0;for(var i=0;i<tasks.length;i++){acc+=tasks[i].dur;if(minute<acc)return i}return tasks.length-1}
function taskProgress(dayProgress,idx){var minute=dayProgress*totalDur,acc=0;for(var i=0;i<idx;i++)acc+=tasks[i].dur;return Math.max(0,Math.min(1,(minute-acc)/tasks[idx].dur))}
function draw(){
  var elapsed=Date.now()-start,day=Math.floor(elapsed/DAY_MS),p=(elapsed%DAY_MS)/DAY_MS;
  var idx=currentTaskIndex(p),local=taskProgress(p,idx);
  var h=6+6*p,hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  timeText.textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm;
  var wd=day%7,visitor=visitors[wd],dayLabel=weekdays[wd]+' · DIA '+(day+1);
  dateText.textContent=dayLabel;visitorText.textContent=visitor;visitorCore.textContent=visitor;dayCore.textContent=dayLabel;currentTaskCore.textContent=tasks[idx].name;actionText.textContent=tasks[idx].name;
  var tip=polar(500,540,245,.06+.88*p);needle.setAttribute('x2',tip.x);needle.setAttribute('y2',tip.y);needleShadow.setAttribute('x2',tip.x+3);needleShadow.setAttribute('y2',tip.y+3);needleTip.setAttribute('cx',tip.x);needleTip.setAttribute('cy',tip.y);
  for(var i=0;i<cards.length;i++){
    var rel=i-idx,pos=rel;if(local>.82){var u=(local-.82)/.18,s=u*u*(3-2*u);pos=rel-s}
    var angle=pos*17,y=12+Math.min(58,Math.abs(pos)*9);
    cards[i].style.top=y+'px';cards[i].style.transform='translateX(-50%) rotate('+angle+'deg) translateY('+(-Math.min(22,Math.abs(pos)*2))+'px)';
    cards[i].classList.toggle('current',i===idx);cards[i].classList.toggle('past',i<idx);cards[i].classList.toggle('future',i>idx);cards[i].style.zIndex=String(20-Math.abs(rel));cards[i].querySelector('.fill').style.width=(i===idx?Math.round(local*100):i<idx?100:0)+'%';
  }
  requestAnimationFrame(draw)
}
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
