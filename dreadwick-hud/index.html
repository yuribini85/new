<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dreadwick HUD CSS</title>
<style>
:root{
  --brass:#b8995d;
  --brass-dark:#6e5932;
  --iron:#252927;
  --iron-2:#111514;
  --paper:#d8c9aa;
  --ink:#2d2b25;
  --blue:#28566f;
  --blue-hi:#3b7391;
  --red:#81392f;
  --red-hi:#a34a3d;
  --cream:#eee2c9;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1012;color:var(--cream);font-family:Georgia,"Times New Roman",serif}
body{touch-action:manipulation}
.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 42%,#344950 0,#1d2c31 35%,#0c1214 76%)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(3,5,5,.85) 0 18%,rgba(4,7,8,.16) 55%,rgba(4,6,7,.45) 100%);pointer-events:none}
.testbar{position:absolute;top:max(10px,env(safe-area-inset-top));right:10px;z-index:50;display:flex;gap:5px}
.testbar button{border:1px solid rgba(220,203,166,.22);background:rgba(11,14,14,.65);color:#bdb3a0;padding:7px 8px;border-radius:3px;font:9px Arial,sans-serif;letter-spacing:.08em}
.testbar button.on{color:#f2e5cb;border-color:#a88953;background:rgba(64,53,35,.72)}
.instrument{position:absolute;left:50%;bottom:-1.5vh;transform:translateX(-50%);width:min(980px,145vw);aspect-ratio:2/1;overflow:visible;filter:drop-shadow(0 -14px 24px rgba(0,0,0,.45))}
.circle{position:absolute;left:0;bottom:-100%;width:100%;aspect-ratio:1/1;border-radius:50%}
.outer{background:radial-gradient(circle at 50% 50%,transparent 0 40.2%,#0b0d0c 40.4% 41.6%,#6c5730 41.8% 42.5%,#c3a56d 42.8% 43.6%,#2b2f2c 43.9% 48%,#121513 48.4% 49.5%,#a18450 49.8% 50.6%,#262925 50.9% 53.5%,transparent 53.8%)}
.outer:before,.outer:after{content:"";position:absolute;border-radius:50%;inset:2.4%;border:2px solid rgba(221,195,137,.35)}
.outer:after{inset:7%;border-color:rgba(0,0,0,.55)}
.dial{bottom:-91%;left:9%;width:82%;background:conic-gradient(from 270deg,#202729 0 90deg,#ddcfad 90deg 180deg,transparent 180deg 360deg);box-shadow:inset 0 0 0 8px #181c1a,inset 0 0 0 11px #927747,inset 0 0 0 15px #292d2a}
.dial:after{content:"";position:absolute;inset:12%;border-radius:50%;border:2px solid rgba(49,48,39,.65);box-shadow:inset 0 0 35px rgba(0,0,0,.15)}
.night-text,.day-text{position:absolute;z-index:10;color:#1e211f;text-align:center;line-height:1}
.night-text{left:24%;bottom:8.5%}.day-text{right:24%;bottom:8.5%}
.num{display:block;font-size:clamp(28px,8vw,66px);font-weight:700}
.moon,.sun{display:block;margin:auto auto 4px;position:relative;width:clamp(22px,5vw,42px);height:clamp(22px,5vw,42px)}
.moon{border-radius:50%;background:#efe1bd;box-shadow:0 0 10px rgba(238,221,177,.35)}
.moon:after{content:"";position:absolute;width:82%;height:82%;border-radius:50%;background:#202729;left:34%;top:-4%}
.sun{border-radius:50%;background:#2e302a;box-shadow:0 -23px 0 -17px #2e302a,0 23px 0 -17px #2e302a,23px 0 0 -17px #2e302a,-23px 0 0 -17px #2e302a,16px 16px 0 -17px #2e302a,-16px 16px 0 -17px #2e302a,16px -16px 0 -17px #2e302a,-16px -16px 0 -17px #2e302a}
.tick-ring{position:absolute;left:50%;bottom:0;width:82%;height:164%;transform:translateX(-50%);z-index:7;pointer-events:none}
.tick{position:absolute;left:50%;bottom:0;width:1px;height:45%;transform-origin:50% 100%;opacity:.75}
.tick:before{content:"";position:absolute;top:0;left:0;width:2px;height:9px;background:#272923}
.tick.major:before{height:17px;width:3px}
.task-rail{position:absolute;left:50%;bottom:0;width:100%;height:100%;transform:translateX(-50%);z-index:14;pointer-events:none}
.task{position:absolute;left:50%;top:0;width:clamp(92px,18vw,150px);height:clamp(48px,8vw,68px);margin-left:calc(var(--w,120px)/-2);border-radius:14px 14px 9px 9px;border:2px solid rgba(20,19,16,.82);box-shadow:inset 0 0 0 2px rgba(228,209,165,.18),inset 0 -10px 22px rgba(0,0,0,.22),0 3px 7px rgba(0,0,0,.38);transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1));opacity:var(--o,0);transition:transform .65s cubic-bezier(.2,.75,.2,1),opacity .45s ease,width .3s ease;overflow:hidden;color:#f3e7cf;text-align:center;padding:9px 8px 7px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.2vw,17px);line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.task.player{background:linear-gradient(#356d8b,#234d66 58%,#1c4157)}
.task.auto{background:linear-gradient(#a74b3d,#80382f 58%,#6c2d27)}
.task.current{box-shadow:inset 0 0 0 2px rgba(244,225,180,.33),inset 0 -12px 24px rgba(0,0,0,.18),0 0 0 2px var(--brass),0 5px 15px rgba(0,0,0,.48);font-weight:700;z-index:4}
.task .progress{position:absolute;left:8px;right:8px;bottom:5px;height:5px;border-radius:10px;background:rgba(10,14,14,.7);overflow:hidden;border:1px solid rgba(239,218,169,.25)}
.task .progress i{display:block;width:var(--p,0%);height:100%;background:linear-gradient(90deg,#9a7d48,#e4c77f);border-radius:10px;transition:width .15s linear}
.center-mark{position:absolute;left:50%;top:-2px;transform:translateX(-50%);z-index:16;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:0;border-bottom:13px solid #d4b879;filter:drop-shadow(0 1px 1px #201d16)}
.visitor{position:absolute;left:50%;bottom:21%;transform:translateX(-50%);z-index:18;width:38%;min-width:170px;text-align:center;color:#292820;pointer-events:none}
.visitor .cap{font:clamp(8px,1.8vw,13px) Arial,sans-serif;letter-spacing:.22em;margin-bottom:4px}
.visitor .name{font-size:clamp(25px,6vw,52px);font-weight:700;line-height:.95;white-space:nowrap}
.visitor .day{margin-top:7px;font:clamp(8px,1.6vw,12px) Arial,sans-serif;letter-spacing:.12em;color:#4c493f}
.visitor:before,.visitor:after{content:"";display:block;height:1px;background:linear-gradient(90deg,transparent,#625d4e,transparent);margin:0 auto 7px;width:78%}.visitor:after{margin:8px auto 0}
.needle-wrap{position:absolute;left:50%;bottom:0;width:0;height:0;z-index:12;transform:rotate(var(--angle,-72deg));transition:transform .06s linear}
.needle{position:absolute;width:4px;height:clamp(120px,31vw,265px);bottom:0;left:-2px;transform-origin:50% 100%;background:linear-gradient(90deg,#755926,#e2c477 45%,#7e602a);clip-path:polygon(34% 100%,66% 100%,100% 12%,50% 0,0 12%);filter:drop-shadow(3px 4px 2px rgba(0,0,0,.4))}
.hub{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);z-index:20;width:clamp(27px,6vw,48px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#d5b66c 0 18%,#6c542b 20% 28%,#1d211e 31% 58%,#a48851 61% 69%,#262a26 72%);box-shadow:0 0 0 2px #0d0f0e,0 2px 8px rgba(0,0,0,.5)}
.basebar{position:absolute;left:2%;right:2%;bottom:0;height:13%;z-index:17;border:2px solid #181a17;border-top:3px solid #b39459;background:linear-gradient(#3a3d36 0,#1c201d 26%,#0f1211 67%,#322b20 69%,#a2834d 77%,#4f4129 84%,#171a18 86%);box-shadow:0 -2px 0 #6f5a34,inset 0 0 0 2px rgba(197,165,98,.18)}
.basebar:before,.basebar:after{content:"";position:absolute;top:36%;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,#b89b60 0 18%,#65502e 22% 50%,#151816 54% 62%,#a38851 66%);box-shadow:0 1px 2px #000}.basebar:before{left:2.2%}.basebar:after{right:2.2%}
.time-read{position:absolute;left:50%;bottom:4.2%;transform:translateX(-50%);z-index:21;font:clamp(9px,2vw,14px) Arial,sans-serif;letter-spacing:.12em;color:#d6c8ac;text-shadow:0 1px 2px #000}
.legend{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;font:8px Arial,sans-serif;letter-spacing:.06em;color:#7f776a;white-space:nowrap}.legend b{font-weight:400}.legend .b:before,.legend .r:before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin:0 4px 0 10px}.legend .b:before{background:var(--blue)}.legend .r:before{background:var(--red)}
@media(max-width:480px){.instrument{width:152vw}.visitor{bottom:22%;width:34%}.task{height:48px}.legend{font-size:7px}}
</style>
</head>
<body>
<div class="stage">
  <div class="testbar"><button id="demo" class="on">1 MIN</button><button id="canon">8 MIN</button></div>
  <div class="instrument" id="instrument">
    <div class="circle outer"></div>
    <div class="circle dial"></div>
    <div class="tick-ring" id="ticks"></div>
    <div class="task-rail" id="taskRail"><div class="center-mark"></div></div>
    <div class="night-text"><span class="moon"></span><span class="num">6</span></div>
    <div class="day-text"><span class="sun"></span><span class="num">12</span></div>
    <div class="needle-wrap" id="needle"><div class="needle"></div></div>
    <div class="visitor"><div class="cap">VISITANTE</div><div class="name" id="visitor">BETSY</div><div class="day" id="dayLabel">SEGUNDA · DIA 1</div></div>
    <div class="basebar"></div>
    <div class="hub"></div>
    <div class="time-read" id="timeRead">06:00</div>
  </div>
  <div class="legend"><b class="b">JOGADOR</b><b class="r">QUINT</b></div>
</div>
<script>
(function(){
'use strict';
var DAY_REAL=60000, DAY_MIN=360, epoch=Date.now();
var visitors=['BETSY','DUNCAN','BETSY','DUNCAN','EDDIE','BETSY','SEM VISITANTE'];
var weekdays=['SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO','DOMINGO'];
var tasks=[
 {name:'Limpar lente',type:'auto',dur:22},
 {name:'Buscar querosene',type:'player',dur:34},
 {name:'Reabastecer farol',type:'auto',dur:28},
 {name:'Registrar clima',type:'player',dur:16},
 {name:'Checar cais',type:'auto',dur:38},
 {name:'Regular mecanismo',type:'player',dur:26},
 {name:'Separar pescado',type:'player',dur:31},
 {name:'Verificar rádio',type:'auto',dur:20},
 {name:'Limpar vidros',type:'player',dur:18},
 {name:'Guardar suprimentos',type:'auto',dur:29}
];
var rail=document.getElementById('taskRail'),needle=document.getElementById('needle'),visitor=document.getElementById('visitor'),dayLabel=document.getElementById('dayLabel'),timeRead=document.getElementById('timeRead'),demo=document.getElementById('demo'),canon=document.getElementById('canon');
var taskEls=[];
var totalTask=tasks.reduce(function(a,t){return a+t.dur},0);
for(var i=0;i<=30;i++){var tick=document.createElement('i');tick.className='tick '+(i%5===0?'major':'');tick.style.transform='rotate('+(-72+144*i/30)+'deg)';document.getElementById('ticks').appendChild(tick)}
tasks.forEach(function(t,i){var el=document.createElement('div');el.className='task '+t.type;el.innerHTML='<span>'+t.name+'</span><div class="progress"><i></i></div>';rail.appendChild(el);taskEls.push(el)});
function sim(){var e=Date.now()-epoch;var day=Math.floor(e/DAY_REAL),p=(e%DAY_REAL)/DAY_REAL;return{day:day,p:p,min:p*DAY_MIN}}
function taskState(min){var q=(min/DAY_MIN)*totalTask,acc=0;for(var i=0;i<tasks.length;i++){var end=acc+tasks[i].dur;if(q<end)return{index:i,progress:(q-acc)/tasks[i].dur};acc=end}return{index:tasks.length-1,progress:1}}
function placeTasks(state){var inst=document.getElementById('instrument'),w=inst.clientWidth,h=inst.clientHeight;var radius=w*.43;var centerY=h*.98;var positions=[-2,-1,0,1,2,3];
 taskEls.forEach(function(el,i){var rel=i-state.index;var slot=positions.indexOf(rel);if(slot<0){el.style.setProperty('--o','0');return}var angle=-90+rel*26;var rad=angle*Math.PI/180;var x=Math.cos(rad)*radius;var y=centerY+Math.sin(rad)*radius-h*.06;var rot=angle+90;var scale=rel===0?1.08:(Math.abs(rel)===1?.96:.88);var opacity=rel===0?1:(Math.abs(rel)===1?.86:.48);el.style.width=Math.max(96,Math.min(154,96+tasks[i].dur*1.4))+'px';el.style.setProperty('--x',x+'px');el.style.setProperty('--y',y+'px');el.style.setProperty('--r',rot+'deg');el.style.setProperty('--s',scale);el.style.setProperty('--o',opacity);el.classList.toggle('current',rel===0);el.querySelector('.progress i').style.setProperty('--p',(rel===0?state.progress*100:0)+'%')})}
function update(){var s=sim();var hh=6+Math.floor(s.min/60),mm=Math.floor(s.min%60);timeRead.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');needle.style.setProperty('--angle',(-72+144*s.p)+'deg');var d=s.day%7;visitor.textContent=visitors[d];dayLabel.textContent=weekdays[d]+' · DIA '+(s.day+1);placeTasks(taskState(s.min));requestAnimationFrame(update)}
function setSpeed(ms){var s=sim(),absolute=s.day+s.p;DAY_REAL=ms;epoch=Date.now()-absolute*DAY_REAL;demo.classList.toggle('on',ms===60000);canon.classList.toggle('on',ms===480000)}
demo.onclick=function(){setSpeed(60000)};canon.onclick=function(){setSpeed(480000)};window.addEventListener('resize',function(){placeTasks(taskState(sim().min))});requestAnimationFrame(update);
})();
</script>
</body>
</html>
