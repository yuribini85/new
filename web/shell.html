#status-logo {
	position: absolute;
	left: calc(56 * var(--u));
	right: calc(56 * var(--u));
	top: calc(env(safe-area-inset-top, 0px) + 17%);
	width: calc(100% - 112 * var(--u));
	height: calc(198 * var(--u));
	object-fit: contain;
}

#status-barra {
	position: absolute;
	left: 50%;
	transform: translateX(-50%);
	top: calc(env(safe-area-inset-top, 0px) + 44%);
	width: calc(460 * var(--u));
	height: calc(10 * var(--u));
	border-radius: calc(5 * var(--u));
	background: rgba(255, 255, 255, 0.12);
	overflow: hidden;
}

#status-preenche {
	height: 100%;
	width: 0%;
	border-radius: inherit;
	background: #c9a054;
	transition: width 0.25s ease-out;
}

#status-barra.indeterminada #status-preenche {
	width: 30%;
	animation: vai 1.2s ease-in-out infinite;
}

@keyframes vai {
	from { transform: translateX(-100%); }
	to { transform: translateX(340%); }
}

#status-etapa {
	position: absolute;
	left: 0;
	right: 0;
	top: calc(env(safe-area-inset-top, 0px) + 44% + 24 * var(--u));
	color: rgba(232, 226, 212, 0.7);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: calc(22 * var(--u));
	text-align: center;
}

#status-aviso {
	position: absolute;
	left: 2rem;
	right: 2rem;
	top: 55%;
	display: none;
	padding: 1rem;
	border: 1px solid #b0544a;
	border-radius: 0.5rem;
	background: #2a1c1e;
	color: #e8e2d4;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	text-align: center;
}

// Versão publicada mais nova que esta página (cache do navegador, ou do
// navegador interno de outro app): recarrega já na nova. __VERSAO__ é trocado
// pelo commit na publicação (.github/workflows/pages.yml).
(function () {
	var v = '__VERSAO__';
	if (v.indexOf('__') === 0) return;
	fetch('versao.txt?t=' + Date.now(), { cache: 'no-store' })
		.then(function (r) { return r.ok ? r.text() : ''; })
		.then(function (t) {
			t = t.trim();
			if (!t || t === v) return;
		var q = new URLSearchParams(location.search);
		if (q.get('v') === t) return;
		q.set('v', t);  // mantém os outros parâmetros (ex.: ?diag=1)
		try { sessionStorage.removeItem('sd_carregando'); } catch (e) {}  // recarga nossa, não queda
		location.replace(location.pathname + '?' + q.toString());
		})
		.catch(function () {});
}());
// iPhone: o Safari só entrega a inclinação (parallax da tela inicial) depois de
// uma permissão pedida num toque. Pede no primeiro toque, uma vez.
window.addEventListener('touchend', function () {
	if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
		DeviceOrientationEvent.requestPermission().catch(function () {});
	}
}, { once: true, capture: true });

	const etapa = document.getElementById('status-etapa');
	let nota = '';
	function mostrarEtapa(texto) {
		etapa.textContent = texto + nota;
	}
	// Erros de script durante o carregamento vão para a tela (no celular não
	// há console para ver).
	window.addEventListener('error', function (e) { falha('Erro: ' + (e.message || e)); });

	// de memória: parece um carregamento infinito. Marca o início e, se a
	// página voltar sem ter terminado, avisa.
	let quedas = 0;
	try {
		quedas = Number(sessionStorage.getItem('sd_quedas') || 0);
		if (sessionStorage.getItem('sd_carregando')) quedas += 1;

		status.style.setProperty('--u', (status.clientWidth / 720) + 'px');

	window.addEventListener('resize', escala);
	status.style.visibility = 'visible';

		console.error(err);

		etapa.style.display = 'none';

			}
			Promise.race([
				registro.then((r) => (r != null ? Promise.reject(new Error('O service worker já existe.')) : r))
					.then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(() => resolve(), 2000)),
			]).then(() => window.location.reload()).catch((err) => console.error(err));
		} else {
			falha('Este navegador não tem recursos necessários para o jogo:\n' + faltando.join('\n'));
		}
		return;
	}
	if (quedas > 0) {
		nota = ' · o navegador fechou o jogo ' + quedas + 'x no carregamento';
	}
	mostrarEtapa('Baixando…');
	engine.startGame({
		'onProgress': function (atual, total) {
			if (atual > 0 && total > 0) {
				barra.classList.remove('indeterminada');
				preenche.style.width = (100 * atual / total).toFixed(1) + '%';
				mostrarEtapa(atual < total
					? 'Baixando ' + Math.floor(100 * atual / total) + '% (' + (atual / 1048576).toFixed(0) + ' de ' + (total / 1048576).toFixed(0) + ' MB)'
					: 'Iniciando o jogo…');
			}
		},
	}).then(() => {
		// O jogo abre na tela inicial com a mesma composição: só some.
		try {
			sessionStorage.removeItem('sd_carregando');
			sessionStorage.removeItem('sd_quedas');
		} catch (e) {}
		status.remove();
	}, falha);
}());
		</script>
	</body>
